    - site: 涡猫社TurboNeko STUDIO
      url: https://turboneko.top/
      owner: 涡猫社TurboNeko STUDIO
      desc: >-
        TurboNeko Studio — 速度即风格

        "燃油在左，幻想在右。我们活在两者的交界处。" 

        我们是谁？

        TurboNeko Studio 是一个把二次元幻想、硬核汽车文化和前沿科技揉在一起的创意厂牌。

        名字里的 Turbo 代表涡轮增压般的爆发力与机械美学——我们追求性能、速度、改装的极致；Neko
        代表猫咪般的灵动创意与破格思维——我们拒绝死板，拥抱想象。

        我们做什么？
         
        🚗 汽车文化内容 — 从经典JDM到新能源性能车，改装方案、车型解析、驾驶文化
         
        🎨 二次元创意融合 — 角色设计、视觉风格、IP联动，让机械也有灵魂
         
        💻 科技前沿探索 — 开源工具、智能交互、数字体验，用代码驱动创意

        我们的态度？

        不跟风，不将就，不画大饼。

        我们相信：真正的好东西，是踩过坑、拧过螺丝、熬过夜之后磨出来的。

        TurboNeko Studio Speed Meets Style. 速度即风格。
      image: https://nachocrazy.top/avatar/logo.jpg
      group: community
      color: "#b7a5ff"
