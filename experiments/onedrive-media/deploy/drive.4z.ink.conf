server {
    listen 80;
    server_name drive.4z.ink;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name drive.4z.ink;
    ssl_certificate /www/server/panel/vhost/cert/4z.ink/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/4z.ink/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1k;
    location / {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8812;
        proxy_http_version 1.1;
        proxy_set_header Host drive.4z.ink;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
        proxy_redirect off;
        proxy_cache off;
        proxy_buffering off;
    }
    access_log off;
    error_log /www/wwwlogs/drive.4z.ink.error.log warn;
}
