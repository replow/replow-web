name: Astro build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astro-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      API_BASE_URL: https://api.4z.ink
      REPLOW_RELEASE: v26.10.21-u${{ github.run_number }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout only the Astro project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.28.2
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Astro production build
        run: pnpm build
      - name: Validate and package complete static site
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/fanqie/index.html
          test -s dist/reading/index.html
          test -s dist/pagefind/pagefind.js
          test -d dist/_astro
          tar -C dist -czf replow-astro.tar.gz .
          sha256sum replow-astro.tar.gz > replow-astro.tar.gz.sha256
      - name: Save Astro artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: replow-astro-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Publish immutable release for Azure pull deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="astro-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" replow-astro.tar.gz replow-astro.tar.gz.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Astro static build #${GITHUB_RUN_NUMBER}" \
            --notes "Verified static Astro build from commit ${GITHUB_SHA}. Azure deployer validates SHA-256 and switches the web symlink after smoke tests." \
            --latest
