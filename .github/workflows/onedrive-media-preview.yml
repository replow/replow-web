name: OneDrive media preview tests
on:
  push:
    branches: [main, preview]
    paths:
      - 'experiments/onedrive-media/**'
      - '.github/workflows/onedrive-media-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media-tests:
    if: github.ref == 'refs/heads/preview' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install isolated PoC dependencies
        run: python -m pip install -r experiments/onedrive-media/requirements.txt
      - name: Verify resolver without production credentials
        working-directory: experiments/onedrive-media
        run: python -m unittest discover -v
