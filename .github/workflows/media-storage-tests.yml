name: Media storage tests
on:
  push:
    branches: [api]
    paths:
      - app/services/media*.py
      - app/services/onedrive_storage.py
      - app/services/quickxor.py
      - tests/test_media_od.py
      - .github/workflows/media-storage-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.ref == 'refs/heads/api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_media_od.py -v
